<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Session</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        .hdr { background: #0a0a0a; padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #111; }
        .hdr .av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .hdr .nm { font-weight: 600; font-size: 14px; }
        .hdr .hd { color: #444; font-size: 12px; }

        /* Pill */
        .pill { position: fixed; top: 56px; right: 12px; background: rgba(180,0,0,0.08); border: 1px solid rgba(180,0,0,0.12); padding: 3px 9px; border-radius: 7px; z-index: 20; display: none; text-align: center; }
        .pill .pl { font-size: 8px; color: #b33; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .pill .pa { font-size: 15px; font-weight: 700; color: #b33; }

        /* Chat */
        .chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 3px; }
        .chat::-webkit-scrollbar { display: none; }

        .b { max-width: 80%; padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-wrap: break-word; animation: p .2s ease; }
        .b.t { background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
        .b.u { background: #1d9bf0; align-self: flex-end; border-bottom-right-radius: 4px; }
        .b.im { padding: 3px; background: none; align-self: flex-start; }
        .b.im img { border-radius: 12px; max-width: 200px; max-height: 260px; display: block; }

        .sn { align-self: center; color: #1db954; font-size: 11px; font-weight: 600; padding: 4px 0; opacity: 0.6; animation: p .3s ease; }

        @keyframes p { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

        .dots { align-self: flex-start; background: #1a1a1a; padding: 11px 15px; border-radius: 18px; border-bottom-left-radius: 4px; display: flex; gap: 3px; }
        .dots span { width: 6px; height: 6px; background: #333; border-radius: 50%; animation: bb 1.2s infinite; }
        .dots span:nth-child(2) { animation-delay: .15s; }
        .dots span:nth-child(3) { animation-delay: .3s; }
        @keyframes bb { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

        /* Send Confirmation Button */
        .send-confirm {
            align-self: center;
            background: #1db954;
            border: none;
            color: #fff;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin: 8px 0;
            animation: p .3s ease;
            transition: 0.2s;
        }
        .send-confirm:active { transform: scale(0.96); }
        .send-confirm:hover { background: #1aa34a; }

        /* Input */
        .ib { background: #0a0a0a; border-top: 1px solid #111; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
        .ib input { flex: 1; background: #111; border: 1px solid #1a1a1a; border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 15px; outline: none; }
        .ib input::placeholder { color: #333; }
        .ib input:focus { border-color: #333; }
        .ib button { background: #1d9bf0; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .ib button:disabled { opacity: 0.15; }
        .ib button svg { fill: #fff; width: 15px; height: 15px; }

        /* End */
        .end { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 200; padding: 40px; }
        .end.show { display: flex; }
        .end .el { color: #444; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .end .et { font-size: 44px; font-weight: 800; color: #b33; }
        .end .em { color: #666; font-size: 13px; text-align: center; max-width: 260px; line-height: 1.5; }
        .end a { padding: 12px 30px; border-radius: 22px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; color: #fff; display: block; }
        .end .ed { background: #1d9bf0; }
        .end .eth { background: #1db954; }
        .end .er { background: none; border: 1px solid #1a1a1a; color: #555; padding: 9px 22px; border-radius: 18px; font-size: 12px; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>

<!-- End -->
<div class="end" id="end">
    <div class="el">session total</div>
    <div class="et" id="endAmt">$0</div>
    <div class="em">session ended 💀<br>want more? u know where to find me</div>
    <a href="#" class="ed" id="dmL" target="_blank">DM on twitter →</a>
    <a href="#" class="eth" id="thL" target="_blank">send on throne 💸</a>
    <button class="er" onclick="location.reload()">new session</button>
</div>

<!-- Header -->
<div class="hdr" id="hdr">
    <div class="av" id="hAv" style="background:#e74c3c">👑</div>
    <div><div class="nm" id="hNm">SCAMGOD</div><div class="hd" id="hHd">@19YOscamgod</div></div>
</div>

<div class="pill" id="pill"><div class="pl">sent</div><div class="pa" id="pAmt">$0</div></div>

<div class="chat" id="chat"></div>

<div class="ib" id="ib">
    <input type="text" id="inp" placeholder="say something..." autocomplete="off" />
    <button id="sb" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
</div>

<script>
let sid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
let drained = 0;
let busy = false;
let info = {};
let pendingDrain = 0;

const chat = document.getElementById('chat');
const inp = document.getElementById('inp');

// Load persona & auto-start
fetch('/api/persona').then(r=>r.json()).then(p => {
    info = p;
    document.getElementById('hAv').textContent = p.avatar;
    document.getElementById('hAv').style.background = p.color;
    document.getElementById('hNm').textContent = p.name;
    document.getElementById('hHd').textContent = p.handle;
    if (p.twitter) document.getElementById('dmL').href = p.twitter;
    if (p.throne) document.getElementById('thL').href = p.throne;

    // Auto-start session
    fetch('/api/start', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sessionId: sid })
    }).then(() => {
        inp.focus();
        toAI('[conversation just started — open with something cocky, ask what theyre into]');
    });
});

function scroll() { chat.scrollTop = chat.scrollHeight; }

function bubble(txt, cls) {
    const d = document.createElement('div');
    d.className = 'b ' + cls;
    d.textContent = txt;
    chat.appendChild(d); scroll();
}

function showImg(url) {
    const d = document.createElement('div');
    d.className = 'b im';
    d.innerHTML = `<img src="${url}" />`;
    chat.appendChild(d); scroll();
}

function showSendButton(amount) {
    pendingDrain = amount;
    const btn = document.createElement('button');
    btn.className = 'send-confirm';
    btn.textContent = `send $${amount} 💸`;
    btn.onclick = () => {
        btn.remove();
        confirmSend(amount);
    };
    chat.appendChild(btn);
    scroll();
}

function confirmSend(amount) {
    drained += amount;
    const d = document.createElement('div');
    d.className = 'sn';
    d.textContent = `$${amount} sent`;
    chat.appendChild(d);
    document.getElementById('pill').style.display = 'block';
    document.getElementById('pAmt').textContent = '$' + drained;
    scroll();

    // Tell AI they sent
    toAI('[they just sent $' + amount + ']');
}

function dots() {
    const d = document.createElement('div');
    d.className = 'dots'; d.id = 'typ';
    d.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(d); scroll();
}
function noDots() { const t = document.getElementById('typ'); if(t) t.remove(); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function send() {
    const t = inp.value.trim();
    if (!t || busy) return;
    inp.value = '';
    bubble(t, 'u');
    await toAI(t);
}

async function toAI(text) {
    busy = true;
    document.getElementById('sb').disabled = true;
    dots();

    try {
        const r = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ sessionId: sid, message: text })
        });
        const d = await r.json();
        noDots();

        // Show messages
        for (let i = 0; i < d.messages.length; i++) {
            if (i > 0) { dots(); await sleep(400 + Math.random()*400); noDots(); }
            bubble(d.messages[i], 't');
            await sleep(120);
        }

        // Show image if any
        if (d.imageUrl) { await sleep(300); showImg(d.imageUrl); }

        // Show send button if AI is asking for money
        if (d.drainAmount > 0) {
            await sleep(400);
            showSendButton(d.drainAmount);
        }

        // End screen
        if (d.triggerEnd) {
            await sleep(1200);
            const end = document.getElementById('end');
            end.classList.add('show');
            let n = 0;
            const iv = setInterval(() => {
                n += Math.ceil(drained/20);
                if (n >= drained) { n = drained; clearInterval(iv); }
                document.getElementById('endAmt').textContent = '$' + n;
            }, 30);
        }
    } catch(e) {
        noDots();
        const r = document.createElement('div');
        r.className = 'sn';
        r.style.cursor = 'pointer';
        r.style.color = '#888';
        r.textContent = 'connection lost — tap to retry';
        r.onclick = async () => { r.remove(); await toAI(text); };
        chat.appendChild(r); scroll();
    }

    busy = false;
    document.getElementById('sb').disabled = false;
    inp.focus();
}

inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
