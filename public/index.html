<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scam Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .screen.hidden { display: none; }

        .intro-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .intro-sub { color: #666; font-size: 14px; text-align: center; max-width: 300px; margin-bottom: 28px; line-height: 1.5; }

        .persona-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; }
        .persona-card {
            background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 14px;
            padding: 16px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .persona-card:active { transform: scale(0.98); background: #111; }
        .persona-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
        }
        .persona-name { font-weight: 700; font-size: 15px; }
        .persona-handle { color: #555; font-size: 12px; }
        .persona-desc { color: #777; font-size: 12px; margin-top: 2px; }

        /* Chat */
        .dm-header {
            background: #0a0a0a; padding: 12px 16px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #151515;
        }
        .dm-header .av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .dm-header .nm { font-weight: 600; font-size: 14px; }
        .dm-header .hd { color: #555; font-size: 12px; }

        .drain-pill {
            position: fixed; top: 58px; right: 12px;
            background: rgba(200,0,0,0.08); border: 1px solid rgba(200,0,0,0.15);
            padding: 4px 10px; border-radius: 8px; z-index: 20;
            display: none; text-align: center;
        }
        .drain-pill .dl { font-size: 9px; color: #cc3333; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .drain-pill .da { font-size: 16px; font-weight: 700; color: #cc3333; }

        .chat {
            flex: 1; overflow-y: auto; padding: 14px;
            display: flex; flex-direction: column; gap: 3px;
        }
        .chat::-webkit-scrollbar { display: none; }

        .b {
            max-width: 80%; padding: 9px 13px; border-radius: 18px;
            font-size: 15px; line-height: 1.35; word-wrap: break-word;
            animation: pop 0.2s ease;
        }
        .b.t { background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
        .b.u { background: #1d9bf0; align-self: flex-end; border-bottom-right-radius: 4px; }
        .b.img { padding: 3px; background: none; }
        .b.img img { border-radius: 12px; max-width: 200px; max-height: 260px; display: block; }

        .sent-notif {
            align-self: center; color: #1db954; font-size: 12px; font-weight: 600;
            padding: 6px 0; opacity: 0.7; animation: pop 0.3s ease;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dots { align-self: flex-start; background: #1a1a1a; padding: 11px 16px; border-radius: 18px; border-bottom-left-radius: 4px; display: flex; gap: 3px; }
        .dots span { width: 6px; height: 6px; background: #444; border-radius: 50%; animation: bop 1.2s infinite; }
        .dots span:nth-child(2) { animation-delay: 0.15s; }
        .dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bop { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

        .ibar {
            background: #0a0a0a; border-top: 1px solid #151515;
            padding: 8px 12px; display: flex; gap: 8px; align-items: center;
        }
        .ibar input {
            flex: 1; background: #111; border: 1px solid #222; border-radius: 20px;
            padding: 10px 16px; color: #fff; font-size: 15px; outline: none;
        }
        .ibar input::placeholder { color: #444; }
        .ibar input:focus { border-color: #333; }
        .ibar button {
            background: #1d9bf0; border: none; border-radius: 50%;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
        }
        .ibar button:disabled { opacity: 0.2; }
        .ibar button svg { fill: #fff; width: 16px; height: 16px; }

        /* End */
        .end { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 200; padding: 40px; }
        .end.show { display: flex; }
        .end .el { color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; }
        .end .et { font-size: 48px; font-weight: 800; color: #cc3333; }
        .end .em { color: #888; font-size: 14px; text-align: center; max-width: 280px; line-height: 1.5; }
        .end a {
            padding: 12px 32px; border-radius: 24px; font-size: 15px; font-weight: 700;
            cursor: pointer; text-decoration: none; color: #fff; border: none; display: block;
        }
        .end .d { background: #1d9bf0; }
        .end .th { background: #1db954; }
        .end .rs { background: none; border: 1px solid #222; color: #666; padding: 10px 24px; border-radius: 20px; font-size: 13px; cursor: pointer; margin-top: 4px; }
    </style>
</head>
<body>

<div class="screen" id="intro">
    <div class="intro-title">💸 scam simulator</div>
    <div class="intro-sub">think u can't be scammed?<br>pick someone & find out.</div>
    <div class="persona-grid" id="pg"></div>
</div>

<div class="end" id="end">
    <div class="el">total drained</div>
    <div class="et" id="endAmt">$0</div>
    <div class="em">that was a simulation ~<br>imagine what the real thing feels like 😂</div>
    <a href="https://twitter.com/messages/compose?text=i+got+scammed+💸" class="d" id="dmLink" target="_blank">dm @18YOSCAM →</a>
    <a href="#" class="th" id="thrLink" target="_blank">throne 💸</a>
    <button class="rs" onclick="location.reload()">try again</button>
</div>

<div class="dm-header" id="hdr" style="display:none">
    <div class="av" id="hAv">💸</div>
    <div><div class="nm" id="hNm">18YO SCAM</div><div class="hd" id="hHd">@18YOSCAM</div></div>
</div>

<div class="drain-pill" id="dp">
    <div class="dl">sent</div>
    <div class="da" id="dAmt">$0</div>
</div>

<div class="chat" id="chat" style="display:none"></div>

<div class="ibar" id="ibar" style="display:none">
    <input type="text" id="inp" placeholder="say something..." autocomplete="off" />
    <button id="sbtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
</div>

<script>
let sid = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
let persona = null;
let drained = 0;
let busy = false;
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');

fetch('/api/personas').then(r=>r.json()).then(ps => {
    const g = document.getElementById('pg');
    for (const [k,p] of Object.entries(ps)) {
        const c = document.createElement('div');
        c.className = 'persona-card';
        c.innerHTML = `<div class="persona-avatar" style="background:${p.color}">${p.avatar}</div><div><div class="persona-name">${p.name}</div><div class="persona-handle">${p.handle}</div><div class="persona-desc">${p.description}</div></div>`;
        c.onclick = () => go(k,p);
        g.appendChild(c);
    }
});

function go(k,p) {
    persona = k;
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('hdr').style.display = 'flex';
    chat.style.display = 'flex';
    document.getElementById('ibar').style.display = 'flex';
    document.getElementById('hAv').textContent = p.avatar;
    document.getElementById('hAv').style.background = p.color;
    document.getElementById('hNm').textContent = p.name;
    document.getElementById('hHd').textContent = p.handle;
    inp.focus();
    toAI('[conversation just started — send the first message]');
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

function bubble(txt, cls) {
    const d = document.createElement('div');
    d.className = 'b ' + cls;
    d.textContent = txt;
    chat.appendChild(d);
    scroll();
}

function showImg(url) {
    const d = document.createElement('div');
    d.className = 'b t img';
    d.innerHTML = `<img src="${url}" />`;
    chat.appendChild(d);
    scroll();
}

function showSent(amt) {
    drained += amt;
    const d = document.createElement('div');
    d.className = 'sent-notif';
    d.textContent = `$${amt} sent`;
    chat.appendChild(d);
    document.getElementById('dp').style.display = 'block';
    document.getElementById('dAmt').textContent = '$' + drained;
    scroll();
}

function dots() {
    const d = document.createElement('div');
    d.className = 'dots'; d.id = 'typ';
    d.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(d); scroll();
}
function noDots() { const t = document.getElementById('typ'); if(t) t.remove(); }

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function send() {
    const t = inp.value.trim();
    if (!t || busy) return;
    inp.value = '';
    bubble(t, 'u');
    await toAI(t);
}

async function toAI(text) {
    busy = true;
    document.getElementById('sbtn').disabled = true;
    dots();

    try {
        const r = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ sessionId: sid, message: text, persona })
        });
        const d = await r.json();
        noDots();

        if (d.drainAmount > 0) showSent(d.drainAmount);

        for (let i = 0; i < d.messages.length; i++) {
            if (i > 0) { dots(); await sleep(500 + Math.random()*400); noDots(); }
            bubble(d.messages[i], 't');
            await sleep(150);
        }

        if (d.imageUrl) { await sleep(300); showImg(d.imageUrl); }

        if (d.triggerEnd) {
            await sleep(1200);
            document.getElementById('end').classList.add('show');
            let n = 0;
            const iv = setInterval(() => {
                n += Math.ceil(drained/20);
                if (n >= drained) { n = drained; clearInterval(iv); }
                document.getElementById('endAmt').textContent = '$' + n;
            }, 30);
        }
    } catch(e) {
        noDots();
        bubble("hold on something broke lol", 't');
    }

    busy = false;
    document.getElementById('sbtn').disabled = false;
    inp.focus();
}

inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
